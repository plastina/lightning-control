name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file executable
        shell: pwsh
        run: |
          # Tag "v1.2.3" -> version "1.2.3"
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          dotnet publish LightingControl.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version `
            -o publish

      - name: Rename executable
        shell: pwsh
        run: |
          Move-Item publish/LightingControl.exe "LightingControl-${{ github.event.release.tag_name }}-win-x64.exe"

      - name: Upload executable to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "LightingControl-${{ github.event.release.tag_name }}-win-x64.exe" `
            --clobber --repo "${{ github.repository }}"
